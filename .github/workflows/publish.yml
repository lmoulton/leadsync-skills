name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.21 or later (trusted publishing and npm stage)
        run: npm install -g npm@^11.21.1
      - name: Check the release tag matches every version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const fs = require("fs")
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"))
            const want = process.env.TAG.replace(/^v/, "")
            const found = {
              "package.json": read("package.json").version,
              "packages/mcp/package.json": read("packages/mcp/package.json").version,
              ".claude-plugin/plugin.json": read(".claude-plugin/plugin.json").version,
              ".claude-plugin/marketplace.json": read(".claude-plugin/marketplace.json").metadata.version,
              "server.json": read("server.json").version,
              "server.json packages[0]": read("server.json").packages[0].version,
            }
            const bad = Object.entries(found).filter(([, v]) => v !== want).map(([f, v]) => f + " is " + v)
            const spec = read(".mcp.json").mcpServers.leadsync.args.at(-1)
            // Anthropic's plugin directory blocks unpinned npx launchers, so the plugin pins the exact release.
            if (spec !== "@leadsync/mcp@" + want) bad.push(".mcp.json runs " + spec)
            if (bad.length) {
              console.error("Release tag " + process.env.TAG + " does not match: " + bad.join("; "))
              process.exit(1)
            }
          '
      - name: Publish @leadsync/mcp
        working-directory: packages/mcp
        run: |
          npm ci
          npm test
          npm run build
          version=$(node -p 'require("./package.json").version')
          if [ -n "$(npm view "@leadsync/mcp@$version" version 2>/dev/null)" ]; then
            echo "@leadsync/mcp@$version is already published; skipping"
          else
            # Staged: a maintainer approves each version with 2FA before it goes live
            # (npm stage approve <id>, or Staged Packages on npmjs.com).
            npm stage publish --provenance --access public
          fi
      - name: Publish @leadsync/skills
        run: |
          npm test
          version=$(node -p 'require("./package.json").version')
          if [ -n "$(npm view "@leadsync/skills@$version" version 2>/dev/null)" ]; then
            echo "@leadsync/skills@$version is already published; skipping"
          else
            # Staged: a maintainer approves each version with 2FA before it goes live
            # (npm stage approve <id>, or Staged Packages on npmjs.com).
            npm stage publish --provenance --access public
          fi
